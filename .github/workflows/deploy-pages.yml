name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # GitHub Pages 实际访问地址（项目页格式：https://<owner>.github.io/<repo>/）
  VITE_SITE_URL: https://dosliu.github.io/liutongxue-web/
  # canonical 域名口径（占位）：
  #   - 原正式域名 www.liutongxue.com.cn 已归简历网站使用，不可再作为本站口径
  #   - 当前用 Pages 地址同时作为 site 与 canonical，并通过 VITE_FORCE_NOINDEX 保持整站不收录
  #   - 正式域名确定后：两个 URL 改成新域名、删除 VITE_FORCE_NOINDEX，
  #     并同步替换 public/sitemap.xml、public/robots.txt、public/llms.txt、README、.env.example 中的占位域名
  VITE_CANONICAL_SITE_URL: https://dosliu.github.io/liutongxue-web/
  # 正式域名就绪前保持整站 noindex（构建层自动注入 robots noindex）
  VITE_FORCE_NOINDEX: '1'
  # 项目页部署必须带 base 路径；绑定自定义域名（根路径部署）时改成 “/” 即可
  PAGES_BASE: /liutongxue-web/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base="$PAGES_BASE"

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Smoke check
        run: npm run check:smoke

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
