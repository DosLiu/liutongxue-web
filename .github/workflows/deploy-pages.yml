name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # GitHub Pages 镜像访问地址（项目页格式：https://<owner>.github.io/<repo>/）
  VITE_SITE_URL: https://dosliu.github.io/liutongxue-web/
  # 正式站点口径：web.liutongxue.com.cn（Vercel 托管，根路径部署）
  # Pages 与正式域名不一致，镜像产物自动注入整站 noindex，canonical / og:url 指向正式地址
  VITE_CANONICAL_SITE_URL: https://web.liutongxue.com.cn
  # 项目页部署必须带 base 路径
  PAGES_BASE: /liutongxue-web/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base="$PAGES_BASE"

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Smoke check
        run: npm run check:smoke

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
